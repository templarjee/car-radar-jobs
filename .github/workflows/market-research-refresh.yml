name: Public external market refresh
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
    - cron: '17 6 * * 1'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['market-recovery-request.json']
permissions:
  contents: read
concurrency:
  group: external-market-low-volume-refresh
  cancel-in-progress: false
jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
  refresh:
    needs: tests
    if: github.repository == 'templarjee/car-radar-jobs' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Fetch and acknowledge bounded private source plan
        env:
          MARKET_REFRESH_KIND: ${{ github.event_name == 'workflow_dispatch' && 'maintenance' || github.event.schedule == '17 6 * * 1' && 'maintenance' || 'onboarding' }}
        run: python market_auto_refresh.py --publish
      - name: Remove private planning evidence
        if: always()
        run: rm -f -- market-auto-refresh-evidence.json
