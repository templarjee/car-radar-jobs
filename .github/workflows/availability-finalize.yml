name: Confirm Arval availability
on:
  workflow_run:
    workflows: ['Arval public catalog', 'Arval emergency catalog recovery']
    types: [completed]
permissions:
  contents: read
  id-token: write
concurrency:
  group: arval-availability-finalize
  cancel-in-progress: false
jobs:
  finalize:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == 'templarjee/car-radar-jobs' && contains(fromJSON('["schedule","workflow_dispatch","push"]'), github.event.workflow_run.event)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python finalize_availability.py
