name: Arval public catalog
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        description: Operation (start with dry-run before import)
        type: choice
        options: [smoke, dry-run, import]
        default: dry-run
  schedule:
    - cron: '17 7 * * *'
permissions:
  contents: read
concurrency:
  group: arval-catalog-collection
  cancel-in-progress: false
jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
  collect:
    needs: smoke
    if: github.repository == 'templarjee/car-radar-jobs' && github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode != 'smoke'))
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Dry crawl and production baseline validation
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'dry-run'
        run: python run_catalog.py --mode dry-run
      - name: Validate and import complete catalog
        if: github.event_name == 'schedule' || inputs.mode == 'import'
        run: python run_catalog.py --mode import
      - name: Remove transient source data
        if: always()
        run: rm -rf -- data baseline.json arval_snapshot_status.json arval_snapshot_partial.json
