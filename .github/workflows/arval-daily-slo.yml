name: Arval catalog daily SLO
on:
  workflow_dispatch:
  # Check near the end of the Prague business day, after scheduled fallbacks.
  schedule:
    - cron: '47 20 * * *'
permissions:
  contents: read
  issues: write
jobs:
  audit:
    if: github.repository == 'templarjee/car-radar-jobs' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify daily catalog ingestion and raise incident if absent
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python check_catalog_daily_slo.py
